name: lexicon

services:
  gateway:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
      - dictionary-api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
      - ${HTTPS_PORT:-443}:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  web:
    build:
      context: ../..
      dockerfile: deploy/server/web.Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /app/.next/cache:size=64m,mode=1777

  semantic-cache-init:
    image: alpine:3.22
    restart: "no"
    network_mode: none
    read_only: true
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    command: ["sh", "-c", "chown 65532:65532 /cache && chmod 0700 /cache"]
    volumes:
      - type: volume
        source: semantic-query-cache
        target: /cache

  dictionary-api:
    build:
      context: ../../services/dictionary-api
    restart: unless-stopped
    init: true
    depends_on:
      semantic-cache-init:
        condition: service_completed_successfully
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    environment:
      DICTIONARY_RUNTIME_DB_PATH: /var/lib/lexicon/dictionary.db
      DICTIONARY_ETYMOLOGY_DB_PATH: /var/lib/lexicon/etymology.db
      DICTIONARY_REVERSE_SEARCH_DB_PATH: /var/lib/lexicon/reverse-search.db
      DICTIONARY_SEMANTIC_SEARCH_DB_PATH: /var/lib/lexicon/semantic-search.db
      DICTIONARY_SEMANTIC_BASE_URL: ${DICTIONARY_SEMANTIC_BASE_URL:-}
      DICTIONARY_SEMANTIC_API_KEY: ${DICTIONARY_SEMANTIC_API_KEY:-}
      DICTIONARY_SEMANTIC_MODEL: ${DICTIONARY_SEMANTIC_MODEL:-Qwen/Qwen3-Embedding-4B}
      DICTIONARY_SEMANTIC_MODEL_KEY: ${DICTIONARY_SEMANTIC_MODEL_KEY:-qwen3-embedding-4b-1024-v1}
      DICTIONARY_SEMANTIC_TIMEOUT: ${DICTIONARY_SEMANTIC_TIMEOUT:-3s}
      DICTIONARY_SEMANTIC_CACHE: ${DICTIONARY_SEMANTIC_CACHE:-128}
      DICTIONARY_SEMANTIC_PERSISTENT_CACHE: ${DICTIONARY_SEMANTIC_PERSISTENT_CACHE:-true}
      DICTIONARY_SEMANTIC_PERSISTENT_CACHE_PATH: /var/cache/lexicon/semantic-query-vectors.db
      DICTIONARY_SEMANTIC_PERSISTENT_CACHE_KEY: ${DICTIONARY_SEMANTIC_PERSISTENT_CACHE_KEY:-}
      DICTIONARY_SEMANTIC_PERSISTENT_CACHE_MAX_ENTRIES: ${DICTIONARY_SEMANTIC_PERSISTENT_CACHE_MAX_ENTRIES:-10000}
      DICTIONARY_SEMANTIC_PERSISTENT_CACHE_TTL: ${DICTIONARY_SEMANTIC_PERSISTENT_CACHE_TTL:-720h}
      DICTIONARY_AUDIO_ZIP_PATH: /var/lib/lexicon/headword-audio.zip
      DICTIONARY_LISTEN: 0.0.0.0:8787
      DICTIONARY_CORS_ORIGINS: ${DICTIONARY_CORS_ORIGINS:?Set DICTIONARY_CORS_ORIGINS in deploy/server/.env}
      DICTIONARY_EXAMPLE_AUDIO_BASE_URL: ${DICTIONARY_EXAMPLE_AUDIO_BASE_URL:-}
      DICTIONARY_ILLUSTRATION_BASE_URL: ${DICTIONARY_ILLUSTRATION_BASE_URL:-}
      DICTIONARY_ILLUSTRATION_URL_TEMPLATE: ${DICTIONARY_ILLUSTRATION_URL_TEMPLATE:-}
      DICTIONARY_ILLUSTRATION_THUMBNAIL_URL_TEMPLATE: ${DICTIONARY_ILLUSTRATION_THUMBNAIL_URL_TEMPLATE:-}
    volumes:
      - type: bind
        source: ${LEXICON_DATA_DIR:-../../data}/dictionary.db
        target: /var/lib/lexicon/dictionary.db
        read_only: true
      - type: bind
        source: ${LEXICON_DATA_DIR:-../../data}/headword-audio.zip
        target: /var/lib/lexicon/headword-audio.zip
        read_only: true
      - type: bind
        source: ${LEXICON_DATA_DIR:-../../data}/etymology.db
        target: /var/lib/lexicon/etymology.db
        read_only: true
      - type: bind
        source: ${LEXICON_DATA_DIR:-../../data}/reverse-search.db
        target: /var/lib/lexicon/reverse-search.db
        read_only: true
      - type: bind
        source: ${LEXICON_DATA_DIR:-../../data}/semantic-search.db
        target: /var/lib/lexicon/semantic-search.db
        read_only: true
      - type: volume
        source: semantic-query-cache
        target: /var/cache/lexicon

volumes:
  caddy-data:
  caddy-config:
  semantic-query-cache:
